<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดตามคิว - Coffee POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .queue-item { transition: all 0.3s ease; }
    .queue-item.ready { animation: bounce 0.5s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .status-pending { background-color: #f59e0b; }
    .status-preparing { background-color: #3b82f6; }
    .status-ready { background-color: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-gray-50">

<!-- Header -->
<div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-6 shadow-lg">
  <div class="container mx-auto px-4 text-center">
    <div class="text-5xl mb-2">☕</div>
    <h1 class="text-3xl font-bold" id="shopName">Coffee Shop</h1>
    <p class="text-blue-100 mt-2">ติดตามสถานะคิวของคุณ</p>
  </div>
</div>

<!-- Main Content -->
<div class="container mx-auto px-4 py-8">

  <!-- Current Queue Number -->
  <div class="bg-white rounded-lg shadow-lg p-8 mb-8 text-center">
    <p class="text-gray-600 text-xl mb-2">คิวของคุณ</p>
    <div class="text-9xl font-bold text-blue-600 mb-4" id="yourQueueNumber">-</div>
    <div id="yourQueueStatus" class="inline-block px-6 py-3 rounded-full text-xl font-semibold">
      <!-- Status will be displayed here -->
    </div>
  </div>

  <!-- Queue Status Info -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6 text-center">
      <div class="text-4xl mb-2">⏱️</div>
      <p class="text-gray-600 mb-2">เวลารอโดยประมาณ</p>
      <p class="text-3xl font-bold text-orange-600" id="estimatedTime">-</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6 text-center">
      <div class="text-4xl mb-2">👥</div>
      <p class="text-gray-600 mb-2">คิวรอทั้งหมด</p>
      <p class="text-3xl font-bold text-blue-600" id="totalPending">-</p>
    </div>

    <div class="bg-white rounded-lg shadow p-6 text-center">
      <div class="text-4xl mb-2">✅</div>
      <p class="text-gray-600 mb-2">คิวที่พร้อมแล้ว</p>
      <p class="text-3xl font-bold text-green-600" id="totalReady">-</p>
    </div>
  </div>

  <!-- Order Details -->
  <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
    <h3 class="text-2xl font-bold mb-4">
      <i class="fas fa-receipt mr-2"></i>รายการสั่งซื้อ
    </h3>
    <div id="orderDetails">
      <p class="text-gray-500 text-center py-8">กำลังโหลด...</p>
    </div>
  </div>

  <!-- Current Queues -->
  <div class="mb-8">
    <h3 class="text-2xl font-bold mb-4">
      <i class="fas fa-list mr-2"></i>คิวปัจจุบัน
    </h3>

    <!-- Processing Queues -->
    <div class="mb-6">
      <h4 class="text-lg font-semibold mb-3 flex items-center">
        <span class="status-dot status-preparing"></span>
        กำลังเตรียม
      </h4>
      <div id="processingQueues" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>

    <!-- Ready Queues -->
    <div class="mb-6">
      <h4 class="text-lg font-semibold mb-3 flex items-center">
        <span class="status-dot status-ready"></span>
        พร้อมแล้ว
      </h4>
      <div id="readyQueues" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>
  </div>

  <!-- Refresh Button -->
  <div class="text-center">
    <button onclick="loadQueueData()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
      <i class="fas fa-sync-alt mr-2"></i>รีเฟรช
    </button>
  </div>

</div>

<!-- Auto Refresh Notice -->
<div class="fixed bottom-4 right-4 bg-white rounded-lg shadow-lg px-4 py-2 text-sm text-gray-600">
  <i class="fas fa-info-circle mr-2"></i>อัพเดทอัตโนมัติทุก 5 วินาที
</div>

<script>
var shopId = '<?= shopId ?>';
var orderId = new URLSearchParams(window.location.search).get('orderId');
var yourQueue = null;

window.onload = function() {
  loadShopInfo();
  loadQueueData();
  setInterval(loadQueueData, 5000); // Auto refresh every 5 seconds
};

function loadShopInfo() {
  google.script.run
    .withSuccessHandler(function(settings) {
      if (settings && settings['ชื่อร้าน']) {
        document.getElementById('shopName').textContent = settings['ชื่อร้าน'];
      }
    })
    .getSettings(shopId);
}

function loadQueueData() {
  google.script.run
    .withSuccessHandler(function(data) {
      displayQueueData(data);
    })
    .withFailureHandler(function(error) {
      console.error('Error loading queue:', error);
    })
    .getQueueData(shopId, orderId);
}

function displayQueueData(data) {
  // Display your queue number
  if (data.yourQueue) {
    yourQueue = data.yourQueue;
    document.getElementById('yourQueueNumber').textContent = data.yourQueue.queueNumber;
    updateQueueStatus(data.yourQueue.status);

    // Display order details
    displayOrderDetails(data.yourQueue);

    // Estimate time
    var waitingQueues = data.allQueues.filter(function(q) {
      return q.queueNumber < data.yourQueue.queueNumber && q.status !== 'พร้อมเสิร์ฟ';
    });
    var totalTime = 0;
    for (var i = 0; i < waitingQueues.length; i++) {
      totalTime += waitingQueues[i].estimatedTime || 5;
    }
    document.getElementById('estimatedTime').textContent = totalTime + ' นาที';
  } else {
    document.getElementById('yourQueueNumber').textContent = '-';
    document.getElementById('estimatedTime').textContent = '-';
  }

  // Count queues
  var pending = 0;
  var ready = 0;
  var processing = [];
  var readyQueues = [];

  for (var i = 0; i < data.allQueues.length; i++) {
    var q = data.allQueues[i];
    if (q.status === 'พร้อมเสิร์ฟ') {
      ready++;
      readyQueues.push(q);
    } else {
      pending++;
      processing.push(q);
    }
  }

  document.getElementById('totalPending').textContent = pending;
  document.getElementById('totalReady').textContent = ready;

  // Display queues
  displayQueues('processingQueues', processing);
  displayQueues('readyQueues', readyQueues);
}

function updateQueueStatus(status) {
  var statusEl = document.getElementById('yourQueueStatus');

  if (status === 'รอทำ') {
    statusEl.className = 'inline-block px-6 py-3 rounded-full text-xl font-semibold bg-yellow-100 text-yellow-800';
    statusEl.innerHTML = '<span class="status-dot status-pending"></span>รอดำเนินการ';
  } else if (status === 'กำลังทำ') {
    statusEl.className = 'inline-block px-6 py-3 rounded-full text-xl font-semibold bg-blue-100 text-blue-800';
    statusEl.innerHTML = '<span class="status-dot status-preparing"></span>กำลังเตรียม';
  } else if (status === 'พร้อมเสิร์ฟ') {
    statusEl.className = 'inline-block px-6 py-3 rounded-full text-xl font-semibold bg-green-100 text-green-800 queue-item ready';
    statusEl.innerHTML = '<span class="status-dot status-ready"></span>พร้อมรับแล้ว! 🎉';

    // Play notification sound (optional)
    try {
      var audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuAzPLZiTYHGGS57OihUBELTKXh8bllHAU2jdXvzn0pBSd+zPDckTsIEl+47+qnVRIJQ5zd8L9vJAUtg8/y3Ik2Bhdjuuv');
      audio.play();
    } catch (e) {}
  }
}

function displayOrderDetails(queue) {
  var html = '<div class="space-y-3">';

  for (var i = 0; i < queue.items.length; i++) {
    var item = queue.items[i];
    html += '<div class="flex justify-between items-center py-2 border-b">' +
      '<div>' +
      '<p class="font-semibold">' + item.name + '</p>' +
      '<p class="text-sm text-gray-500">จำนวน: ' + item.quantity + '</p>' +
      '</div>' +
      '</div>';
  }

  html += '</div>';
  html += '<div class="mt-4 pt-4 border-t">';
  html += '<div class="flex justify-between items-center">';
  html += '<span class="text-lg font-semibold">เวลาเตรียมโดยประมาณ:</span>';
  html += '<span class="text-lg font-bold text-blue-600">' + (queue.estimatedTime || 5) + ' นาที</span>';
  html += '</div>';
  html += '</div>';

  document.getElementById('orderDetails').innerHTML = html;
}

function displayQueues(containerId, queues) {
  var container = document.getElementById(containerId);

  if (queues.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-center col-span-full py-4">ไม่มีคิว</p>';
    return;
  }

  var html = '';
  for (var i = 0; i < queues.length; i++) {
    var q = queues[i];
    var isYours = yourQueue && q.queueNumber === yourQueue.queueNumber;
    var bgColor = isYours ? 'bg-blue-500 text-white' : 'bg-white text-gray-800';
    var borderColor = isYours ? 'border-blue-500 border-4' : 'border-gray-200 border-2';

    html += '<div class="queue-item ' + bgColor + ' ' + borderColor + ' rounded-lg p-4 text-center shadow-lg">';
    html += '<div class="text-4xl font-bold mb-2">' + q.queueNumber + '</div>';
    if (isYours) {
      html += '<div class="text-sm font-semibold">คิวของคุณ</div>';
    }
    html += '</div>';
  }

  container.innerHTML = html;
}

// Test data for development
if (window.location.hostname === 'localhost' && !orderId) {
  setTimeout(function() {
    displayQueueData({
      yourQueue: {
        queueNumber: 15,
        status: 'กำลังทำ',
        estimatedTime: 8,
        items: [
          { name: 'Latte เย็น', quantity: 2 },
          { name: 'Americano ร้อน', quantity: 1 }
        ]
      },
      allQueues: [
        { queueNumber: 12, status: 'พร้อมเสิร์ฟ', estimatedTime: 0 },
        { queueNumber: 13, status: 'พร้อมเสิร์ฟ', estimatedTime: 0 },
        { queueNumber: 14, status: 'กำลังทำ', estimatedTime: 5 },
        { queueNumber: 15, status: 'กำลังทำ', estimatedTime: 8 },
        { queueNumber: 16, status: 'รอทำ', estimatedTime: 10 },
        { queueNumber: 17, status: 'รอทำ', estimatedTime: 5 }
      ]
    });
  }, 500);
}
</script>

</body>
</html>
