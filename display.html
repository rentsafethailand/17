          <div class="flex justify-between items-center text-3xl font-bold">

            <span id="orderTotal">฿0</span>

      </div>

      <!-- QR Payment Display -->
      <div id="qrPaymentScreen" style="display: none;" class="animate-slide text-center">

      <p class="text-lg text-gray-600">ลาเต้เย็น - ฿55</p>
    </div>
  </div>

  <!-- Ad Panel 3 -->
  <div class="ad-panel">
    <div id="adPanel3" class="text-center">
      <div class="text-6xl mb-4">🎁</div>
      <h3 class="text-2xl font-bold mb-2">สะสมแต้ม</h3>
      <p class="text-lg text-gray-600">ทุก 10 แก้ว รับฟรี 1 แก้ว</p>
    </div>
  </div>
</div>

<script>
var shopId = '<?= shopId ?>';
var currentOrder = null;
var lastUpdateTime = 0;

window.onload = function() {
  loadShopInfo();
  startPolling();
};

function loadShopInfo() {
  google.script.run
    .withSuccessHandler(function(settings) {
      if (settings && settings['ชื่อร้าน']) {
        document.getElementById('shopNameDisplay').textContent = settings['ชื่อร้าน'];
      }
    })
    .getSettings(shopId);
}

function startPolling() {
  checkForUpdates();
  setInterval(checkForUpdates, 3000); // Check every 3 seconds
}

function checkForUpdates() {
  // Check for new orders or status changes
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.timestamp > lastUpdateTime) {
        lastUpdateTime = data.timestamp;
        handleUpdate(data);
      }
    })
    .getDisplayData(shopId);
}

function handleUpdate(data) {
  if (data.type === 'NEW_ORDER') {
    showOrder(data.order);
  } else if (data.type === 'PAYMENT_QR') {
    showQRPayment(data.amount, data.promptpay);
  } else if (data.type === 'ORDER_COMPLETE') {
    showThankYou(data.queueNumber, data.orderId);
  } else if (data.type === 'RESET') {
    showWelcome();
  }
}

function showWelcome() {
  hideAllScreens();
  document.getElementById('welcomeScreen').style.display = 'block';
}

function showOrder(order) {
  hideAllScreens();

  var itemsHtml = '';
  for (var i = 0; i < order.items.length; i++) {
    var item = order.items[i];
    itemsHtml += '<div class="flex justify-between items-center mb-4 text-2xl">' +
      '<div>' +
      '<div class="font-semibold">' + item.name + '</div>' +
      '<div class="text-lg opacity-75">x ' + item.quantity + '</div>' +
      '</div>' +
      '<div class="font-bold">฿' + item.total.toFixed(2) + '</div>' +
      '</div>';
  }

  document.getElementById('orderItems').innerHTML = itemsHtml;
  document.getElementById('orderTotal').textContent = '฿' + order.total.toFixed(2);
  document.getElementById('orderScreen').style.display = 'block';
}

function showQRPayment(amount, promptpay) {
  hideAllScreens();

  var qrUrl = 'https://promptpay.io/' + promptpay + '/' + amount + '.png';
  document.getElementById('displayQRCode').innerHTML =
    '<img src="' + qrUrl + '" style="width: 400px; height: 400px;">';
  document.getElementById('qrAmount').textContent = '฿' + amount.toFixed(2);
  document.getElementById('qrPaymentScreen').style.display = 'block';
}

function showThankYou(queueNumber, orderId) {
  hideAllScreens();

  document.getElementById('displayQueueNumber').textContent = queueNumber;

  var queueUrl = window.location.origin + window.location.pathname + '?page=queue&shopId=' + shopId + '&orderId=' + orderId;
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(queueUrl);

  document.getElementById('queueTrackingQR').innerHTML =
    '<img src="' + qrUrl + '" style="width: 200px; height: 200px;">';

  document.getElementById('thankYouScreen').style.display = 'block';

  // Auto return to welcome after 10 seconds
  setTimeout(showWelcome, 10000);
}

function hideAllScreens() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('orderScreen').style.display = 'none';
  document.getElementById('qrPaymentScreen').style.display = 'none';
  document.getElementById('thankYouScreen').style.display = 'none';
}

// Simulate updates for testing (remove in production)
if (window.location.hostname === 'localhost') {
  setTimeout(function() {
    showOrder({
      items: [
        { name: 'Latte เย็น', quantity: 2, total: 110 },
        { name: 'Americano ร้อน', quantity: 1, total: 45 }
      ],
      total: 155
    });
  }, 3000);

  setTimeout(function() {
    showQRPayment(155, '0995588665');
  }, 8000);

  setTimeout(function() {
    showThankYou(42, 'ORD-001');
  }, 13000);
}
</script>

</body>
